name: CPU tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      AERODML_GPU_TESTS: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install AeroDML
        run: python -m pip install -e .
      - name: Check dependencies
        run: python -m pip check
      - name: Run CPU tests
        run: python -m unittest discover -s tests -v
